<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOY的日本tabelog美食地圖</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; }
    #map { height: 100%; width: 100%; z-index: 10; }
    .custom-marker {
      display: flex; align-items: center; justify-content: center;
      border-radius: 9999px; font-weight: 800; font-size: 11px; color: white;
      box-shadow: 0 3px 10px rgba(0,0,0,0.35); border: 2px solid white;
      transition: transform 0.15s ease;
    }
    .custom-marker:hover { transform: scale(1.2); z-index: 1000 !important; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden">

  <!-- 頂部導覽列：z-50 確保選單在最上層不被覆蓋 -->
  <header class="bg-slate-900 text-white px-3 sm:px-4 py-2.5 shadow-md flex items-center justify-between gap-2 relative z-50 shrink-0">
    <div class="flex items-center gap-2">
      <span class="bg-amber-500 text-slate-950 font-black px-2 py-0.5 rounded text-xs tracking-wide">TABELOG</span>
      <h1 class="font-bold text-sm sm:text-base tracking-tight truncate max-w-[200px] sm:max-w-none">BOY的日本tabelog美食地圖</h1>
    </div>

    <!-- 右側：漢堡選單 -->
    <div class="relative">
      <button onclick="toggleMenu()" class="p-2 text-slate-200 hover:text-white hover:bg-slate-800 rounded-lg transition" title="功能選單">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>

      <!-- 下拉選單：最高層級 z-[100] -->
      <div id="dropdown-menu" class="hidden absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-2xl border border-slate-200 py-1.5 z-[100] text-slate-800 text-xs font-semibold">
        <button onclick="openAddModal(); toggleMenu();" class="w-full text-left px-4 py-2.5 hover:bg-slate-100 flex items-center gap-2 text-emerald-700 font-bold border-b border-slate-100">
          <span>➕ 新增 / 解析 Tabelog</span>
        </button>
        <label class="w-full text-left px-4 py-2.5 hover:bg-slate-100 flex items-center gap-2 text-blue-700 font-bold cursor-pointer">
          <span>📂 匯入 JSON (智慧合併)</span>
          <input type="file" accept=".json" class="hidden" onchange="handleFileUpload(event); toggleMenu();" />
        </label>
        <button onclick="exportJson(); toggleMenu();" class="w-full text-left px-4 py-2.5 hover:bg-slate-100 flex items-center gap-2 text-slate-700 font-bold">
          <span>💾 匯出目前完整資料庫</span>
        </button>
        <div class="border-t border-slate-100 my-1"></div>
        <button onclick="restoreDefaultData(); toggleMenu();" class="w-full text-left px-4 py-2 hover:bg-rose-50 text-rose-600 font-medium">
          <span>🔄 還原預設資料庫</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 車站橫向滑動列：z-30 低於 Header 避免擋住下拉選單 -->
  <div class="bg-slate-900 border-t border-slate-800 px-3 py-1.5 flex items-center gap-1.5 overflow-x-auto shrink-0 relative z-30" id="station-buttons-bar">
    <span class="text-xs text-amber-400 font-bold shrink-0 mr-1">選擇車站：</span>
    <div class="flex items-center gap-1.5" id="station-buttons"></div>
  </div>

  <!-- 主畫面 -->
  <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative z-10">

    <!-- 左側面板 -->
    <aside class="w-full md:w-[420px] lg:w-[450px] bg-white border-r border-slate-200 flex flex-col h-1/2 md:h-full shrink-0 z-20">

      <div class="p-3 border-b border-slate-200 space-y-2.5 bg-slate-50">
        <!-- 星等篩選 -->
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="text-xs font-bold text-slate-700">Tabelog 星等級距篩選</label>
            <select id="sub-rating-filter" onchange="applyFilters()" class="bg-white border border-slate-300 rounded px-1.5 py-0.5 text-[11px] font-bold text-slate-700">
              <option value="0">細分：全部顯示</option>
              <option value="3.5">3.50★ 以上 (百名店)</option>
              <option value="3.7">3.70★ 以上 (超高分)</option>
            </select>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <label id="box-tier3" class="flex items-center gap-2 p-2 rounded-lg border-2 border-blue-500 bg-blue-50/40 cursor-pointer transition">
              <input type="checkbox" id="tier-3" checked onchange="applyFilters()" class="w-4 h-4 rounded text-blue-600 focus:ring-0" />
              <div class="leading-tight">
                <div class="text-xs font-bold text-slate-900">3.0 ～ 3.9 顆星</div>
                <div class="text-[11px] text-slate-500" id="count-tier3">日常好店 &amp; 百名店</div>
              </div>
            </label>

            <label id="box-tier4" class="flex items-center gap-2 p-2 rounded-lg border-2 border-amber-500 bg-amber-50/40 cursor-pointer transition">
              <input type="checkbox" id="tier-4" checked onchange="applyFilters()" class="w-4 h-4 rounded text-amber-600 focus:ring-0" />
              <div class="leading-tight">
                <div class="text-xs font-bold text-amber-700">4.0 ～ 5.0 顆星</div>
                <div class="text-[11px] text-slate-500" id="count-tier4">Tabelog 頂級神店</div>
              </div>
            </label>
          </div>
        </div>

        <!-- 價格帶篩選 -->
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="text-xs font-bold text-slate-700">預算價格帶 (日圓)</label>
            <button onclick="resetFilters()" class="text-[11px] text-blue-600 hover:underline font-semibold">重設條件</button>
          </div>

          <div class="grid grid-cols-3 gap-1 p-1 bg-slate-200/80 rounded-lg mb-1.5 text-xs font-bold">
            <button type="button" id="btn-any" onclick="setMealPeriod('any')" class="py-0.5 rounded bg-slate-900 text-white shadow-sm transition">🕒 不分時段</button>
            <button type="button" id="btn-lunch" onclick="setMealPeriod('lunch')" class="py-0.5 rounded text-slate-600 hover:text-slate-900 transition">☀️ 午餐</button>
            <button type="button" id="btn-dinner" onclick="setMealPeriod('dinner')" class="py-0.5 rounded text-slate-600 hover:text-slate-900 transition">🌙 晚餐</button>
          </div>

          <div class="flex items-center gap-1.5">
            <select id="min-price" onchange="applyFilters()" class="flex-1 border border-slate-300 rounded-lg px-2 py-1 text-xs bg-white font-semibold">
              <option value="0">最低：¥0 (不限)</option>
              <option value="1000">最低：¥1,000</option>
              <option value="2000">最低：¥2,000</option>
              <option value="3000">最低：¥3,000</option>
              <option value="5000">最低：¥5,000</option>
              <option value="10000">最低：¥10,000</option>
            </select>
            <span class="text-slate-400 font-bold">～</span>
            <select id="max-price" onchange="applyFilters()" class="flex-1 border border-slate-300 rounded-lg px-2 py-1 text-xs bg-white font-semibold">
              <option value="999999">最高：不限金額</option>
              <option value="1000">最高：¥1,000</option>
              <option value="2000">最高：¥2,000</option>
              <option value="3000">最高：¥3,000</option>
              <option value="5000">最高：¥5,000</option>
              <option value="10000">最高：¥10,000</option>
              <option value="30000">最高：¥30,000</option>
            </select>
          </div>

          <div class="mt-2 flex items-center justify-between gap-2 pt-1.5 border-t border-slate-200">
            <input type="text" id="keyword-input" oninput="applyFilters()" placeholder="🔍 搜尋店名或料理 (例: 燒肉、牛舌、拉麵)..." class="flex-1 border border-slate-300 rounded-lg px-2 py-1 text-xs bg-white focus:outline-none focus:border-amber-500" />
            <span id="result-count" class="text-xs font-black text-amber-700 bg-amber-100 px-2 py-0.5 rounded shrink-0">共 0 間</span>
          </div>
        </div>
      </div>

      <!-- 排序與狀態提示 -->
      <div id="status-banner" class="bg-slate-800 text-slate-100 px-3 py-1.5 text-xs flex items-center justify-between shrink-0">
        <span id="status-text" class="truncate mr-2">目前顯示：全部車站</span>
        <select id="sort-select" onchange="applyFilters()" class="bg-slate-700 text-white text-[11px] rounded px-1.5 py-0.5 border border-slate-600 shrink-0">
          <option value="rating-desc">依星等：高 ➔ 低</option>
          <option value="price-asc">依預算：低 ➔ 高</option>
          <option value="price-desc">依預算：高 ➔ 低</option>
        </select>
      </div>

      <!-- 餐廳列表 -->
      <div id="restaurant-list" class="flex-1 overflow-y-auto p-2 space-y-2 bg-slate-100/60"></div>
    </aside>

    <!-- 右側地圖區 -->
    <main class="flex-1 relative h-1/2 md:h-full">
      <div id="map"></div>

      <!-- ℹ️ 符號與可展開收合的星等圖例 -->
      <div class="absolute bottom-5 right-4 z-[400] flex flex-col items-end gap-2">
        <div id="legend-card" class="hidden bg-white/95 backdrop-blur px-3.5 py-2.5 rounded-xl shadow-xl border border-slate-200 text-xs space-y-1.5 transition-all">
          <div class="flex items-center justify-between gap-3 font-bold text-slate-800 border-b border-slate-100 pb-1">
            <span>Tabelog 星等圖釘圖例</span>
            <button onclick="toggleLegend()" class="text-slate-400 hover:text-slate-700 text-sm font-bold">&times;</button>
          </div>
          <div class="flex items-center gap-2">
            <span class="w-3.5 h-3.5 rounded-full bg-amber-500 inline-block border border-white shadow shrink-0"></span>
            <span><strong>4.00 ～ 5.00 ★</strong> 頂級傳奇神店</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="w-3.5 h-3.5 rounded-full bg-rose-600 inline-block border border-white shadow shrink-0"></span>
            <span><strong>3.50 ～ 3.99 ★</strong> 百名店 / 排隊名店</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="w-3.5 h-3.5 rounded-full bg-blue-600 inline-block border border-white shadow shrink-0"></span>
            <span><strong>3.00 ～ 3.49 ★</strong> 車站周邊穩定好店</span>
          </div>
        </div>

        <button onclick="toggleLegend()" class="w-9 h-9 bg-white/95 hover:bg-white text-slate-800 rounded-full shadow-lg border border-slate-200 flex items-center justify-center font-bold text-base transition transform active:scale-95" title="顯示/隱藏星等圖例">
          ℹ️
        </button>
      </div>
    </main>
  </div>

  <!-- 新增餐廳彈窗 -->
  <div id="add-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-[110] p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden border border-slate-200 max-h-[92vh] flex flex-col">
      <div class="bg-slate-900 text-white px-5 py-3 flex items-center justify-between">
        <h2 class="font-bold text-sm sm:text-base">➕ 新增餐廳至資料庫</h2>
        <button onclick="closeAddModal()" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
      </div>

      <div class="p-4 overflow-y-auto space-y-3.5 text-xs">
        <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 space-y-1.5">
          <div class="font-bold text-amber-900">⚡ 方式 A：貼上 Tabelog 餐廳原始碼 (Ctrl+U)</div>
          <textarea id="raw-html-input" rows="3" placeholder="在此貼上 Tabelog 原始碼..." class="w-full border border-amber-300 rounded-lg p-2 text-xs bg-white focus:outline-none"></textarea>
          <button type="button" onclick="parsePastedHtml()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-1.5 rounded-lg transition">
            🔍 自動解析店名、星等與座標
          </button>
        </div>

        <div class="space-y-2">
          <div class="font-bold text-slate-700">✍️ 方式 B：手動輸入 / 確認解析</div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-slate-600 mb-0.5 font-medium">所屬車站</label>
              <select id="f-station" class="w-full border border-slate-300 rounded-lg px-2 py-1.5"></select>
            </div>
            <div>
              <label class="block text-slate-600 mb-0.5 font-medium">Tabelog 星等 (3.0~5.0)</label>
              <input type="number" step="0.01" id="f-rating" placeholder="例: 3.76" class="w-full border border-slate-300 rounded-lg px-2 py-1.5" />
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-slate-600 mb-0.5 font-medium">餐廳名稱</label>
              <input type="text" id="f-name" placeholder="例: 29 Terrace" class="w-full border border-slate-300 rounded-lg px-2 py-1.5" />
            </div>
            <div>
              <label class="block text-slate-600 mb-0.5 font-medium">料理分類</label>
              <input type="text" id="f-category" placeholder="例: 燒肉 / 牛舌" class="w-full border border-slate-300 rounded-lg px-2 py-1.5" />
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-slate-600 mb-0.5 font-medium">☀️ 午餐預算</label>
              <input type="text" id="f-lunch" placeholder="￥1,000～￥1,999" class="w-full border border-slate-300 rounded-lg px-2 py-1.5" />
            </div>
            <div>
              <label class="block text-slate-600 mb-0.5 font-medium">🌙 晚餐預算</label>
              <input type="text" id="f-dinner" placeholder="￥3,000～￥3,999" class="w-full border border-slate-300 rounded-lg px-2 py-1.5" />
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-slate-600 mb-0.5 font-medium">緯度 (Latitude)</label>
              <input type="number" step="0.00001" id="f-lat" placeholder="可留空自動靠站" class="w-full border border-slate-300 rounded-lg px-2 py-1.5" />
            </div>
            <div>
              <label class="block text-slate-600 mb-0.5 font-medium">經度 (Longitude)</label>
              <input type="number" step="0.00001" id="f-lng" placeholder="可留空自動靠站" class="w-full border border-slate-300 rounded-lg px-2 py-1.5" />
            </div>
          </div>

          <div>
            <label class="block text-slate-600 mb-0.5 font-medium">Tabelog 網址 &amp; 備註</label>
            <input type="text" id="f-url" placeholder="https://tabelog.com/..." class="w-full border border-slate-300 rounded-lg px-2 py-1.5 mb-1.5" />
            <input type="text" id="f-note" placeholder="備註 (例: 車站步行3分鐘、百名店)" class="w-full border border-slate-300 rounded-lg px-2 py-1.5" />
          </div>
        </div>
      </div>

      <div class="bg-slate-50 px-4 py-2.5 border-t border-slate-200 flex items-center justify-end gap-2">
        <button onclick="closeAddModal()" class="px-3.5 py-1.5 rounded-lg border border-slate-300 text-xs font-semibold">取消</button>
        <button onclick="saveNewRestaurant()" class="px-4 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold">✅ 儲存加入地圖</button>
      </div>
    </div>
  </div>

  <script>

        }

        const st = STATIONS[k];
        const cnt = restaurantsData.filter(r => r.station === k).length;
        html += `<button onclick="selectStation('${k}')" data-station="${k}" class="station-btn bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1 rounded-full text-xs shrink-0 transition">📍 ${st.name} (${cnt})</button>`;

        const opt = document.createElement("option");

        fStation.appendChild(opt);
      });

    function updateStationCounts() {
      document.querySelectorAll(".station-btn").forEach(btn => {
        const st = btn.dataset.station;
        if (st === "all") {
          btn.textContent = `全部車站 (${restaurantsData.length})`;
        } else if (STATIONS[st]) {
          const cnt = restaurantsData.filter(r => r.station === st).length;
          btn.textContent = `📍 ${STATIONS[st].name} (${cnt})`;
        }
      });
    }

    function parsePriceString(priceText) {
      if (!priceText) return [null, null];
      const cleaned = priceText.trim();
      if (cleaned === "-" || cleaned === "－" || cleaned === "") return [null, null];
      const matches = cleaned.match(/[0-9,]+/g);
      if (!matches) return [null, null];
      const nums = matches.map(n => parseInt(n.replace(/,/g, ""), 10)).filter(n => !isNaN(n));
      if (nums.length >= 2) return [nums[0], nums[1]];
      if (nums.length === 1) {
        if (cleaned.startsWith("～") || cleaned.startsWith("~")) return [0, nums[0]];
        if (cleaned.endsWith("～") || cleaned.endsWith("~")) return [nums[0], 999999];
        return [nums[0], nums[0]];
      }
      return [null, null];
    }

    function initMap() {
      loadStoredData();
      buildStationButtons();

      markersLayer = L.layerGroup().addTo(map);
      stationCircleLayer = L.layerGroup().addTo(map);

      drawStationCircles();
      applyFilters();

      document.addEventListener("click", (e) => {
        const menu = document.getElementById("dropdown-menu");
        const btn = e.target.closest("button[onclick='toggleMenu()']");
        if (!menu.contains(e.target) && !btn && !menu.classList.contains("hidden")) {
          menu.classList.add("hidden");
        }
      });
    }

    function drawStationCircles() {
      stationCircleLayer.clearLayers();
      const keys = currentStation === "all" ? Object.keys(STATIONS) : [currentStation];
      keys.forEach(k => {
        const st = STATIONS[k];
        if (!st) return;
        L.circle([st.lat, st.lng], {
          radius: 550, color: "#2563eb", weight: 1.5, dashArray: "4, 4",
          fillColor: "#3b82f6", fillOpacity: 0.05
        }).bindTooltip(`${st.name} 周邊步行圈`, { sticky: true }).addTo(stationCircleLayer);
      });
    }

    function selectStation(stationKey) {
      currentStation = stationKey;
      document.querySelectorAll(".station-btn").forEach(btn => {
        if (btn.dataset.station === stationKey) {
          btn.className = "station-btn bg-amber-500 text-slate-950 font-bold px-3 py-1 rounded-full text-xs shrink-0 transition shadow";
        } else {
          btn.className = "station-btn bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1 rounded-full text-xs shrink-0 transition";
        }
      });

      if (stationKey === "all") {
        map.flyTo([35.681, 139.755], 12, { duration: 0.6 });
      } else if (STATIONS[stationKey]) {
        const st = STATIONS[stationKey];
        map.flyTo([st.lat, st.lng], st.zoom, { duration: 0.6 });
      }
      drawStationCircles();
      applyFilters();
    }

    function setMealPeriod(period) {
      currentMealPeriod = period;
      ["any", "lunch", "dinner"].forEach(p => {
        const btn = document.getElementById("btn-" + p);
        if (p === period) {
          btn.className = "py-0.5 rounded bg-slate-900 text-white shadow-sm transition";
        } else {
          btn.className = "py-0.5 rounded text-slate-600 hover:text-slate-900 transition";
        }
      });
      applyFilters();
    }

    function resetFilters() {
      document.getElementById("tier-3").checked = true;
      document.getElementById("tier-4").checked = true;
      document.getElementById("sub-rating-filter").value = "0";
      document.getElementById("min-price").value = "0";
      document.getElementById("max-price").value = "999999";
      document.getElementById("keyword-input").value = "";
      setMealPeriod("any");
    }

    function getMarkerColor(rating) {
      if (rating >= 4.0) return "#f59e0b";
      if (rating >= 3.5) return "#e11d48";
      return "#2563eb";
    }

    function applyFilters() {
      const includeTier3 = document.getElementById("tier-3").checked;
      const includeTier4 = document.getElementById("tier-4").checked;
      const minRatingFloor = parseFloat(document.getElementById("sub-rating-filter").value || "0");
      const userMinPrice = parseInt(document.getElementById("min-price").value, 10);
      const userMaxPrice = parseInt(document.getElementById("max-price").value, 10);
      const keyword = (document.getElementById("keyword-input").value || "").trim().toLowerCase();
      const sortMode = document.getElementById("sort-select").value;

      const stationPool = restaurantsData.filter(r => currentStation === "all" || r.station === currentStation);
      const t3Count = stationPool.filter(r => r.rating >= 3.0 && r.rating < 4.0).length;
      const t4Count = stationPool.filter(r => r.rating >= 4.0).length;
      document.getElementById("count-tier3").textContent = `該站共 ${t3Count} 間 (日常/百名店)`;
      document.getElementById("count-tier4").textContent = `該站共 ${t4Count} 間 (傳奇神店)`;

      let filtered = stationPool.filter(item => {
        const isTier3 = item.rating >= 3.0 && item.rating < 4.0;
        const isTier4 = item.rating >= 4.0 && item.rating <= 5.0;
        if (isTier3 && !includeTier3) return false;
        if (isTier4 && !includeTier4) return false;
        if (item.rating < minRatingFloor) return false;

        if (keyword) {
          const hay = `${item.name} ${item.category} ${item.note || ""} ${item.station_name}`.toLowerCase();
          if (!hay.includes(keyword)) return false;
        }

        const matchPrice = (minVal, maxVal) => {
          if (minVal === null || maxVal === null) return false;
          return minVal <= userMaxPrice && maxVal >= userMinPrice;
        };

        if (userMinPrice === 0 && userMaxPrice >= 999999) {
          return true;
        } else if (currentMealPeriod === "lunch") {
          return matchPrice(item.lunch_min, item.lunch_max);
        } else if (currentMealPeriod === "dinner") {
          return matchPrice(item.dinner_min, item.dinner_max);
        } else {
          return matchPrice(item.lunch_min, item.lunch_max) || matchPrice(item.dinner_min, item.dinner_max);
        }
      });

      filtered.sort((a, b) => {
        if (sortMode === "rating-desc") return b.rating - a.rating;
        const getRepPrice = r => {
          if (currentMealPeriod === "lunch") return r.lunch_min ?? 999999;
          if (currentMealPeriod === "dinner") return r.dinner_min ?? 999999;
          return Math.min(r.lunch_min ?? 999999, r.dinner_min ?? 999999);
        };
        if (sortMode === "price-asc") return getRepPrice(a) - getRepPrice(b);
        if (sortMode === "price-desc") return getRepPrice(b) - getRepPrice(a);
        return 0;
      });

      const stLabel = currentStation === "all" ? "全部車站" : STATIONS[currentStation].name;
      document.getElementById("status-text").textContent = `目前顯示：${stLabel}（篩選後 ${filtered.length} / ${stationPool.length} 間）`;
      document.getElementById("result-count").textContent = `符合 ${filtered.length} 間`;

      renderMapMarkers(filtered);
      renderSidebarList(filtered);
    }

            <h3 class="font-bold text-sm text-slate-900 mb-1">${item.name}</h3>
            <p class="text-xs text-slate-600 mb-2">${item.note || ""}</p>
            <div class="text-xs bg-slate-50 p-2 rounded border border-slate-200 space-y-1 mb-2.5">
              <div>☀️ 午餐：<strong class="text-slate-800">${item.lunch_text || "-"}</strong></div>
              <div>🌙 晚餐：<strong class="text-slate-800">${item.dinner_text || "-"}</strong></div>
            </div>
            <div class="grid grid-cols-2 gap-1.5 text-center text-xs font-bold">
              <a href="${item.url}" target="_blank" rel="noopener" class="bg-amber-500 hover:bg-amber-600 text-white py-1.5 px-2 rounded">Tabelog 原頁</a>
              <a href="${gmapUrl}" target="_blank" rel="noopener" class="bg-blue-600 hover:bg-blue-700 text-white py-1.5 px-2 rounded">Google 導航</a>
            </div>
          </div>
        `;
        const m = L.marker([item.lat, item.lng], { icon }).bindPopup(popupHtml);
        m.addTo(markersLayer);
        markerMap[item.id] = m;
      });
    }

    function renderSidebarList(list) {
      const container = document.getElementById("restaurant-list");
      if (list.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 px-4 bg-white rounded-xl border border-slate-200">
            <div class="text-3xl mb-2">🍽️</div>
            <div class="text-sm font-bold text-slate-700">此篩選條件下沒有符合的餐廳</div>
            <p class="text-xs text-slate-500 mt-1">請點選「重設條件」或放寬星等與金額。</p>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(item => {
        const badgeColor = item.rating >= 4.0
          ? "bg-amber-500 text-white"
          : (item.rating >= 3.5 ? "bg-rose-600 text-white" : "bg-blue-600 text-white");
        const tierTag = item.rating >= 4.0 ? "4.0~5.0★ 頂級神店" : (item.rating >= 3.5 ? "3.0~3.9★ (百名店)" : "3.0~3.9★ (日常好店)");

        return `
          <div onclick="focusRestaurant('${item.id}')" class="p-2.5 rounded-xl border border-slate-200 hover:border-amber-500 bg-white cursor-pointer transition shadow-sm">
            <div class="flex items-start justify-between gap-2">
              <div>
                <div class="flex items-center gap-1.5 mb-1">
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-800 text-amber-400">${item.station_name}</span>
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600">${item.category}</span>
                </div>
                <h3 class="font-bold text-sm text-slate-900">${item.name}</h3>
              </div>
              <div class="text-right shrink-0">
                <span class="inline-block text-xs font-black px-2 py-0.5 rounded-md ${badgeColor}">★ ${item.rating.toFixed(2)}</span>
                <div class="text-[10px] text-slate-400 mt-0.5">${tierTag}</div>
              </div>
            </div>
            <p class="text-xs text-slate-500 mt-1">${item.note || ""}</p>
            <div class="mt-2 pt-2 border-t border-slate-100 flex items-center justify-between text-[11px]">
              <div class="space-x-2">
                <span class="text-slate-700">☀️ 午：<strong>${item.lunch_text || "-"}</strong></span>
                <span class="text-slate-700">🌙 晚：<strong>${item.dinner_text || "-"}</strong></span>
              </div>
              <div class="flex items-center gap-2">
                <a href="${item.url}" target="_blank" onclick="event.stopPropagation()" class="text-amber-600 font-bold hover:underline">Tabelog ↗</a>
                <button onclick="deleteRestaurant(event, '${item.id}')" class="text-slate-300 hover:text-rose-500" title="刪除此餐廳">🗑️</button>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function focusRestaurant(id) {
      const item = restaurantsData.find(r => r.id === id);
      const marker = markerMap[id];
      if (item && marker) {
        map.flyTo([item.lat, item.lng], 16, { duration: 0.6 });
        setTimeout(() => marker.openPopup(), 650);
      }
    }

    function deleteRestaurant(e, id) {
      e.stopPropagation();
      if (!confirm("確定要從資料庫移除這間餐廳嗎？")) return;
      restaurantsData = restaurantsData.filter(r => r.id !== id);
      saveToStorage();
      applyFilters();
    }

    function openAddModal() {
      if (currentStation !== "all") {
        document.getElementById("f-station").value = currentStation;
      }
      document.getElementById("add-modal").classList.remove("hidden");
      document.getElementById("add-modal").classList.add("flex");
    }

    function closeAddModal() {
      document.getElementById("add-modal").classList.add("hidden");
      document.getElementById("add-modal").classList.remove("flex");
    }

    function parsePastedHtml() {
      const raw = document.getElementById("raw-html-input").value;
      if (!raw || raw.length < 50) {
        alert("請先貼上 Tabelog 原始碼！");
        return;
      }

      const parser = new DOMParser();
      const doc = parser.parseFromString(raw, "text/html");

      let foundLd = null;
      doc.querySelectorAll('script[type="application/ld+json"]').forEach(sc => {
        try {
          const data = JSON.parse(sc.textContent);
          const arr = Array.isArray(data) ? data : [data];
          arr.forEach(obj => {
            if (obj && obj["@type"] === "Restaurant") foundLd = obj;
          });
        } catch (err) {}
      });

      if (foundLd) {
        document.getElementById("f-name").value = foundLd.name || "";
        if (foundLd.aggregateRating && foundLd.aggregateRating.ratingValue) {
          document.getElementById("f-rating").value = foundLd.aggregateRating.ratingValue;
        }
        if (foundLd.geo) {
          document.getElementById("f-lat").value = foundLd.geo.latitude || "";
          document.getElementById("f-lng").value = foundLd.geo.longitude || "";
        }
        if (foundLd.servesCuisine) {
          document.getElementById("f-category").value = Array.isArray(foundLd.servesCuisine) ? foundLd.servesCuisine.join(" / ") : foundLd.servesCuisine;
        }
        if (foundLd["@id"] || foundLd.url) {
          document.getElementById("f-url").value = foundLd.url || foundLd["@id"];
        }
      }

      const dinnerEl = doc.querySelector(".rdheader-budget__icon--dinner .rdheader-budget__price-target");
      const lunchEl = doc.querySelector(".rdheader-budget__icon--lunch .rdheader-budget__price-target");
      if (dinnerEl) document.getElementById("f-dinner").value = dinnerEl.textContent.trim();
      if (lunchEl) document.getElementById("f-lunch").value = lunchEl.textContent.trim();

      if (foundLd) {
        alert("🎉 解析成功！已自動填入資料，請確認後按「儲存加入地圖」。");
      } else {
        alert("找不到標準資料，請確認貼上的是 Tabelog 餐廳頁原始碼 (Ctrl+U)。");
      }
    }

    function saveNewRestaurant() {
      const stKey = document.getElementById("f-station").value;
      const stObj = STATIONS[stKey];
      const name = document.getElementById("f-name").value.trim();
      const rating = parseFloat(document.getElementById("f-rating").value);
      const category = document.getElementById("f-category").value.trim() || "日本料理";
      const lunchText = document.getElementById("f-lunch").value.trim() || "-";
      const dinnerText = document.getElementById("f-dinner").value.trim() || "-";
      let lat = parseFloat(document.getElementById("f-lat").value);
      let lng = parseFloat(document.getElementById("f-lng").value);
      const url = document.getElementById("f-url").value.trim() || "https://tabelog.com/";
      const note = document.getElementById("f-note").value.trim() || "自訂新增店家";

      if (!name || isNaN(rating)) {
        alert("請至少填寫店名與星等！");
        return;
      }

      if (isNaN(lat) || isNaN(lng)) {
        lat = stObj.lat + (Math.random() - 0.5) * 0.003;
        lng = stObj.lng + (Math.random() - 0.5) * 0.003;
      }

      const [lMin, lMax] = parsePriceString(lunchText);
      const [dMin, dMax] = parsePriceString(dinnerText);

      const newEntry = {
        id: "custom_" + Date.now(),
        station: stKey,
        station_name: stObj.name,
        name, category, rating,
        lunch_text: lunchText, lunch_min: lMin, lunch_max: lMax,
        dinner_text: dinnerText, dinner_min: dMin, dinner_max: dMax,
        lat, lng, url, note
      };

      restaurantsData.unshift(newEntry);
      saveToStorage();
      closeAddModal();
      selectStation(stKey);
      focusRestaurant(newEntry.id);
    }

    function restoreDefaultData() {
      if (!confirm("確定要重設為預設資料庫嗎？")) return;
      localStorage.removeItem(STORAGE_KEY);
      restaurantsData = JSON.parse(JSON.stringify(DEFAULT_RESTAURANTS));
      saveToStorage();
      buildStationButtons();
      selectStation("all");
      applyFilters();
      alert("✅ 已恢復預設資料庫！");
    }

    function exportJson() {
      const blob = new Blob([JSON.stringify(restaurantsData, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "boy_tabelog_all_stations.json";
      a.click();
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported) && imported.length > 0) {
            const mapByName = new Map();
            restaurantsData.forEach(r => mapByName.set(r.name, r));

            imported.forEach((r, idx) => {
              if (!r.station) r.station = "tokyo";
              if (!r.station_name) r.station_name = "東京駅";
              if (!r.id) r.id = "imp_" + idx + "_" + Date.now();
              mapByName.set(r.name, r);
            });

            restaurantsData = Array.from(mapByName.values());
            saveToStorage();
            buildStationButtons();
            selectStation("tokyo");
            alert(`🎉 成功智慧合併！目前全站共有 ${restaurantsData.length} 間餐廳！`);
          }
        } catch (err) {
          alert("JSON 檔案格式錯誤：" + err.message);
        }
      };
      reader.readAsText(file);
    }

    window.addEventListener("DOMContentLoaded", initMap);
  </script>
</body>
